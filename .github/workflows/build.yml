name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            qt6-base-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Capture UI scenarios
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tools/screenshots/capture.py default --offscreen
          python3 tools/screenshots/capture.py narrow-inspector --offscreen
          python3 tools/screenshots/capture.py automation --offscreen
          python3 tools/screenshots/capture.py vcs --offscreen

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: odw-ui-snapshots
          path: artifacts/screenshots/
          if-no-files-found: error
